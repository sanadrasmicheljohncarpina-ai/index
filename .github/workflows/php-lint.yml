name: PHP syntax check

on:
  push:
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            echo "Linting $file"
            if ! php -l "$file" >/dev/null; then
              php -l "$file" || true
              failed=1
            fi
          done < <(find . -type f -name '*.php' \
            -not -path './.git/*' \
            -not -path './vendor/*')
          exit "$failed"
