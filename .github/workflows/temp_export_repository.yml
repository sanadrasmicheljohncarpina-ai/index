name: Temp Export Repository

on:
  push:
    branches:
      - feature/generalized-questionnaire

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive repository
        run: git archive --format=zip --output=/tmp/index-feature.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: index-feature-generalized-questionnaire
          path: /tmp/index-feature.zip
          retention-days: 1
